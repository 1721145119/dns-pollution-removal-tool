name: Debug with Upterm

on:
  workflow_dispatch:   # 支持手动触发，便于按需调试

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 可选：在此处添加你的构建或测试步骤
      # - name: Run build
      #   run: make build

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        with:
          # 若无人连接，30 分钟后自动关闭会话，避免浪费资源
          wait-timeout-minutes: 180